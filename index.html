<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Pong Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #100520, #04010a);
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .wrapper {
      position: relative;
    }
    canvas {
      background: #020008;
      border: 2px solid #ff007f;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.35), inset 0 0 25px rgba(0, 242, 254, 0.15);
      border-radius: 8px;
      display: block;
    }
    /* Audio Toggle Button */
    .sound-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(17, 5, 36, 0.95);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      z-index: 50;
      pointer-events: auto;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      transition: all 0.2s;
    }
    .sound-btn:hover {
      background: #00f2fe;
      color: #04010a;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
    }
    /* Menus & Overlays */
    .menu-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 1, 14, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      z-index: 30;
      pointer-events: auto;
    }
    /* Countdown Overlay */
    .countdown-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 1, 14, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      z-index: 40;
      pointer-events: none;
    }
    .countdown-text {
      font-size: 75px;
      font-weight: 900;
      color: #00f2fe;
      text-shadow: 0 0 25px #00f2fe, 0 0 50px rgba(0, 242, 254, 0.8);
      letter-spacing: 6px;
      pointer-events: none;
      animation: popIn 0.85s ease-out forwards;
    }
    @keyframes popIn {
      0% {
        transform: scale(0.35);
        opacity: 0;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
      80% {
        transform: scale(1.0);
        opacity: 1;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.1;
      }
    }
    .hidden {
      display: none !important;
      pointer-events: none !important;
    }
    h1 {
      font-size: 38px;
      color: #00f2fe;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.8), 0 0 30px #00f2fe;
      margin-bottom: 22px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    label {
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      color: #ff007f;
    }
    input[type="text"] {
      background: #110524;
      border: 2px solid #00f2fe;
      padding: 10px 16px;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
      text-align: center;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      width: 240px;
      pointer-events: auto;
    }
    .diff-group {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }
    .diff-btn {
      background: #110524;
      border: 1px solid #777;
      color: #aaa;
      padding: 8px 18px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: auto;
      transition: all 0.2s;
    }
    .diff-btn.selected {
      border-color: #ff007f;
      color: #ff007f;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
      font-weight: bold;
    }
    .start-btn {
      background: #ff007f;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      padding: 12px 36px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 2px;
      pointer-events: auto;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.9);
    }
    .legend {
      margin-top: 15px;
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Sound Toggle -->
    <button id="soundToggle" class="sound-btn" type="button">AUDIO: ON</button>

    <!-- COUNTDOWN OVERLAY -->
    <div id="countdownScreen" class="countdown-screen hidden">
      <div id="countdownText" class="countdown-text">THREE</div>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="menu-screen">
      <h1>Cyber Pong Arena</h1>
      <div class="form-group">
        <label for="playerName">ENTER PILOT CALLSIGN</label>
        <input type="text" id="playerName" value="PLAYER 1" maxlength="10">
      </div>
      <div class="diff-group">
        <button class="diff-btn" data-diff="EASY" type="button">EASY</button>
        <button class="diff-btn selected" data-diff="MEDIUM" type="button">MEDIUM</button>
        <button class="diff-btn" data-diff="HARD" type="button">HARD</button>
      </div>
      <button class="start-btn" id="startBtn" type="button">LAUNCH MATCH</button>
      <div class="legend">Controls: [W] / [S] or [▲] / [▼] Arrow Keys</div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameOverScreen" class="menu-screen hidden">
      <h1 id="winnerText">VICTORY</h1>
      <button class="start-btn" id="restartBtn" type="button">PLAY AGAIN</button>
    </div>

    <!-- CANVAS -->
    <canvas id="gameCanvas" width="850" height="520"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Hooks
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const countdownScreen = document.getElementById('countdownScreen');
    const countdownText = document.getElementById('countdownText');
    const winnerText = document.getElementById('winnerText');
    const playerNameInput = document.getElementById('playerName');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const diffButtons = document.querySelectorAll('.diff-btn');
    const soundToggle = document.getElementById('soundToggle');

    // ========================================================
    // SOFT & NATURAL FEMALE VOICE SYNTHESIS
    // ========================================================
    let cachedSoftVoice = null;

    function getSoftNaturalVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const preferred = [
        'google uk english female',
        'google us english',
        'jenny natural',
        'samantha',
        'victoria',
        'karen',
        'fiona',
        'serena',
        'moira',
        'zira',
        'female'
      ];

      for (const query of preferred) {
        const match = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(query));
        if (match) return match;
      }
      return voices.find(v => v.lang.startsWith('en')) || voices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        cachedSoftVoice = getSoftNaturalVoice();
      };
      cachedSoftVoice = getSoftNaturalVoice();
    }

    function speakSoftFemale(word) {
      if (isMuted || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        if (!cachedSoftVoice) cachedSoftVoice = getSoftNaturalVoice();
        if (cachedSoftVoice) utterance.voice = cachedSoftVoice;

        utterance.pitch = 1.02;
        utterance.rate = 0.88;
        utterance.volume = 0.85;

        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.warn('Speech synthesis unavailable:', e);
      }
    }

    // ========================================================
    // ORIGINAL 128 BPM EDM TRACK (FIRST BGM IMPLEMENTATION)
    // ========================================================
    let audioCtx = null;
    let masterGain = null;
    let isMuted = false;
    let musicInterval = null;
    let currentStep = 0;

    const EDM_NOTES = {
      A1: 55.0,  C2: 65.41, D2: 73.42, F2: 87.31,
      A2: 110.0, C3: 130.81, D3: 146.83, E3: 164.81,
      A3: 220.0, C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.00, A4: 440.0
    };

    // 16-step original rolling bass & lead sequences
    const BASS_LINE = [
      EDM_NOTES.A1, EDM_NOTES.A1, EDM_NOTES.A2, EDM_NOTES.A1,
      EDM_NOTES.F2, EDM_NOTES.F2, EDM_NOTES.A2, EDM_NOTES.F2,
      EDM_NOTES.D2, EDM_NOTES.D2, EDM_NOTES.A2, EDM_NOTES.D2,
      EDM_NOTES.C2, EDM_NOTES.C2, EDM_NOTES.E3, EDM_NOTES.C2
    ];

    const LEAD_LINE = [
      EDM_NOTES.A3, EDM_NOTES.C4, EDM_NOTES.E4, EDM_NOTES.A4,
      EDM_NOTES.G4, EDM_NOTES.E4, EDM_NOTES.C4, EDM_NOTES.D4,
      EDM_NOTES.F2, EDM_NOTES.A3, EDM_NOTES.D4, EDM_NOTES.E4,
      EDM_NOTES.C4, EDM_NOTES.E4, EDM_NOTES.A4, EDM_NOTES.G4
    ];

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function stopEDMTrack() {
      if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
      }
    }

    function playKick(time) {
      if (isMuted || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(140, time);
      osc.frequency.exponentialRampToValueAtTime(32, time + 0.08);
      gain.gain.setValueAtTime(0.7, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(time);
      osc.stop(time + 0.12);
    }

    function playSynthTone(freq, time, duration, type = 'sawtooth', volume = 0.15) {
      if (isMuted || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, time);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1800, time);
      filter.frequency.exponentialRampToValueAtTime(450, time + duration);

      gain.gain.setValueAtTime(volume, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);

      osc.start(time);
      osc.stop(time + duration);
    }

    function playHiHat(time) {
      if (isMuted || !audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.03;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(7500, time);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.08, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);

      whiteNoise.start(time);
      whiteNoise.stop(time + 0.03);
    }

    function startEDMTrack() {
      initAudio();
      stopEDMTrack();
      const stepDuration = (60 / 128) / 4 * 1000;

      musicInterval = setInterval(() => {
        if (!isGameRunning || !audioCtx) return;
        const now = audioCtx.currentTime;

        if (currentStep % 4 === 0) playKick(now);
        if (currentStep % 4 === 2) playHiHat(now);

        const bassFreq = BASS_LINE[currentStep % 16];
        playSynthTone(bassFreq, now, 0.12, 'sawtooth', 0.22);

        const leadFreq = LEAD_LINE[currentStep % 16];
        playSynthTone(leadFreq, now + 0.01, 0.1, 'square', 0.1);

        currentStep = (currentStep + 1) % 16;
      }, stepDuration);
    }

    function playSfx(freq, type = 'sine', duration = 0.09) {
      if (isMuted || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // ==========================================
    // COUNTDOWN SEQUENCE
    // ==========================================
    function runCountdown(onComplete) {
      countdownScreen.classList.remove('hidden');
      const sequence = [
        { text: 'THREE', color: '#00f2fe', sfx: 440 },
        { text: 'TWO',   color: '#00f2fe', sfx: 554 },
        { text: 'ONE',   color: '#ffb703', sfx: 659 },
        { text: 'GO!',   color: '#ff007f', sfx: 880 }
      ];

      let idx = 0;
      function showNext() {
        if (idx >= sequence.length) {
          countdownScreen.classList.add('hidden');
          onComplete();
          return;
        }

        const step = sequence[idx];
        countdownText.textContent = step.text;
        countdownText.style.color = step.color;
        countdownText.style.textShadow = `0 0 25px ${step.color}, 0 0 50px ${step.color}`;

        countdownText.style.animation = 'none';
        void countdownText.offsetWidth;
        countdownText.style.animation = 'popIn 0.85s ease-out forwards';

        speakSoftFemale(step.text.replace('!', ''));
        playSfx(step.sfx, 'sine', 0.12);

        idx++;
        setTimeout(showNext, 1000);
      }

      showNext();
    }

    soundToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      isMuted = !isMuted;
      soundToggle.textContent = isMuted ? 'AUDIO: OFF' : 'AUDIO: ON';
      soundToggle.style.color = isMuted ? '#888' : '#00f2fe';
      soundToggle.style.borderColor = isMuted ? '#777' : '#00f2fe';
    });

    // ==========================================
    // GAME CORE
    // ==========================================
    const DIFFICULTIES = {
      EASY: { ballSpeed: 5, aiSpeed: 3.6, maxBallSpeed: 10 },
      MEDIUM: { ballSpeed: 6.5, aiSpeed: 5.2, maxBallSpeed: 13.5 },
      HARD: { ballSpeed: 8, aiSpeed: 6.8, maxBallSpeed: 16.5 }
    };
    let currentDifficulty = 'MEDIUM';
    let playerName = 'PLAYER 1';
    let isGameRunning = false;

    const BLADE_WIDTH = 18;
    const BLADE_BASE_HEIGHT = 80;
    const BASE_PLAYER_SPEED = 7;

    const player = {
      x: 35,
      y: 0,
      w: BLADE_WIDTH,
      h: BLADE_BASE_HEIGHT,
      speed: BASE_PLAYER_SPEED,
      score: 0,
      powerTimer: 0,
      angle: 0,
      rubberColor: '#ff0055',
      woodColor: '#d4a373',
      handleColor: '#1d3557'
    };

    const ai = {
      x: 0,
      y: 0,
      w: BLADE_WIDTH,
      h: BLADE_BASE_HEIGHT,
      speed: 5.2,
      score: 0,
      freezeTimer: 0,
      angle: 0,
      rubberColor: '#1a1a24',
      woodColor: '#d4a373',
      handleColor: '#3a0ca3'
    };

    let ball = {
      x: 0,
      y: 0,
      r: 7,
      speed: 6.5,
      dx: 6.5,
      dy: 0,
      trail: []
    };

    let powerUp = null;
    const POWER_TYPES = [
      { type: 'SPEED', color: '#ffb703', symbol: '⚡' },
      { type: 'LENGTH', color: '#06d6a0', symbol: '🛡️' },
      { type: 'FREEZE', color: '#118ab2', symbol: '❄️' }
    ];

    let floatingTexts = [];
    let particles = [];
    const keys = {};

    window.addEventListener('keydown', (e) => { keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    diffButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        diffButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentDifficulty = btn.dataset.diff;
      });
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initMatchCountdown();
    });

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initMatchCountdown();
    });

    function initMatchCountdown() {
      initAudio();
      stopEDMTrack();

      playerName = playerNameInput.value.trim().toUpperCase() || 'PLAYER 1';
      player.score = 0;
      ai.score = 0;
      player.h = BLADE_BASE_HEIGHT;
      player.speed = BASE_PLAYER_SPEED;
      player.angle = 0;

      ai.h = BLADE_BASE_HEIGHT;
      ai.speed = DIFFICULTIES[currentDifficulty].aiSpeed;
      ai.angle = 0;

      player.y = (canvas.height - player.h) / 2;
      ai.x = canvas.width - 35 - BLADE_WIDTH;
      ai.y = (canvas.height - ai.h) / 2;

      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = 0;
      ball.dy = 0;
      ball.trail = [];
      powerUp = null;
      floatingTexts = [];

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      isGameRunning = false;

      runCountdown(() => {
        isGameRunning = true;
        startEDMTrack();
        resetBall(true);
      });
    }

    function spawnPowerUp() {
      const typeObj = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
      powerUp = {
        x: canvas.width / 4 + Math.random() * (canvas.width / 2),
        y: 50 + Math.random() * (canvas.height - 100),
        size: 22,
        ...typeObj
      };
    }

    function spawnFloatingText(text, x, y, color = '#00f2fe') {
      floatingTexts.push({
        text: text,
        x: x,
        y: y,
        color: color,
        life: 1.0,
        vy: -1.2
      });
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 16; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 1.0,
          color: color
        });
      }
    }

    function resetBall(serveToPlayer) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = DIFFICULTIES[currentDifficulty].ballSpeed;
      ball.trail = [];

      const dir = serveToPlayer ? -1 : 1;
      const angle = (Math.random() * (Math.PI / 4)) - (Math.PI / 8);

      ball.dx = dir * ball.speed * Math.cos(angle);
      ball.dy = ball.speed * Math.sin(angle);

      if (!powerUp && Math.random() > 0.45) {
        spawnPowerUp();
      }
    }

    function checkCollision(b, p) {
      const closeX = Math.max(p.x, Math.min(b.x, p.x + p.w));
      const closeY = Math.max(p.y, Math.min(b.y, p.y + p.h));
      const dx = b.x - closeX;
      const dy = b.y - closeY;
      return (dx * dx + dy * dy) <= (b.r * b.r);
    }

    function bouncePaddle(p, dir, color) {
      const center = p.y + (p.h / 2);
      let offset = (ball.y - center) / (p.h / 2);
      offset = Math.max(-1, Math.min(1, offset));

      const bounceAngle = offset * (Math.PI / 3.8);
      ball.speed = Math.min(ball.speed + 0.4, DIFFICULTIES[currentDifficulty].maxBallSpeed);

      ball.dx = dir * ball.speed * Math.cos(bounceAngle);
      ball.dy = ball.speed * Math.sin(bounceAngle);

      if (dir === 1) ball.x = p.x + p.w + ball.r;
      else ball.x = p.x - ball.r;

      playSfx(520, 'square', 0.08);
      spawnParticles(ball.x, ball.y, color);
    }

    function update() {
      if (!isGameRunning) return;

      if (player.powerTimer > 0) {
        player.powerTimer--;
        if (player.powerTimer === 0) {
          player.speed = BASE_PLAYER_SPEED;
          player.h = BLADE_BASE_HEIGHT;
        }
      }

      if (ai.freezeTimer > 0) {
        ai.freezeTimer--;
      }

      let targetPlayerAngle = 0;
      if (keys['w'] || keys['W'] || keys['ArrowUp']) {
        player.y -= player.speed;
        targetPlayerAngle = -0.15;
      }
      if (keys['s'] || keys['S'] || keys['ArrowDown']) {
        player.y += player.speed;
        targetPlayerAngle = 0.15;
      }
      player.angle += (targetPlayerAngle - player.angle) * 0.2;
      player.y = Math.max(10, Math.min(canvas.height - player.h - 10, player.y));

      const activeAiSpeed = ai.freezeTimer > 0 ? DIFFICULTIES[currentDifficulty].aiSpeed * 0.35 : DIFFICULTIES[currentDifficulty].aiSpeed;
      const aiCenter = ai.y + (ai.h / 2);
      let targetAiAngle = 0;

      if (ball.y < aiCenter - 10) {
        ai.y -= activeAiSpeed;
        targetAiAngle = -0.12;
      } else if (ball.y > aiCenter + 10) {
        ai.y += activeAiSpeed;
        targetAiAngle = 0.12;
      }
      ai.angle += (targetAiAngle - ai.angle) * 0.15;
      ai.y = Math.max(10, Math.min(canvas.height - ai.h - 10, ai.y));

      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 8) ball.trail.shift();

      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall Bounces
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.dy = -ball.dy;
        playSfx(240, 'sine', 0.06);
        spawnParticles(ball.x, ball.y, '#ffffff');
      } else if (ball.y + ball.r >= canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.dy = -ball.dy;
        playSfx(240, 'sine', 0.06);
        spawnParticles(ball.x, ball.y, '#ffffff');
      }

      if (ball.dx < 0 && checkCollision(ball, player)) bouncePaddle(player, 1, '#ff0055');
      if (ball.dx > 0 && checkCollision(ball, ai)) bouncePaddle(ai, -1, '#00f2fe');

      // Power-Up Pickup
      if (powerUp) {
        const dx = ball.x - (powerUp.x + powerUp.size / 2);
        const dy = ball.y - (powerUp.y + powerUp.size / 2);
        if (Math.sqrt(dx * dx + dy * dy) < ball.r + powerUp.size / 2) {
          if (powerUp.type === 'SPEED') {
            player.speed = BASE_PLAYER_SPEED + 4;
            player.powerTimer = 360;
          } else if (powerUp.type === 'LENGTH') {
            player.h = BLADE_BASE_HEIGHT + 45;
            player.powerTimer = 360;
          } else if (powerUp.type === 'FREEZE') {
            ai.freezeTimer = 220;
          }

          // Announce with soft female voice & floating neon text
          speakSoftFemale("Power up!");
          spawnFloatingText("POWER UP!", powerUp.x + powerUp.size / 2, powerUp.y, powerUp.color);

          playSfx(880, 'triangle', 0.25);
          spawnParticles(powerUp.x, powerUp.y, powerUp.color);
          powerUp = null;
        }
      }

      // Scoring
      if (ball.x + ball.r < 0) {
        ai.score++;
        playSfx(140, 'sawtooth', 0.3);
        checkWinCondition();
        if (isGameRunning) resetBall(false);
      } else if (ball.x - ball.r > canvas.width) {
        player.score++;
        playSfx(660, 'sine', 0.2);
        checkWinCondition();
        if (isGameRunning) resetBall(true);
      }

      // Update Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function checkWinCondition() {
      const WIN_SCORE = 7;
      if (player.score >= WIN_SCORE || ai.score >= WIN_SCORE) {
        isGameRunning = false;
        stopEDMTrack();
        winnerText.textContent = player.score >= WIN_SCORE ? `${playerName} WINS!` : 'AI DOMINATION!';
        winnerText.style.color = player.score >= WIN_SCORE ? '#00f2fe' : '#ff007f';
        gameOverScreen.classList.remove('hidden');
      }
    }

    function drawTableTennisBat(bat, isLeft) {
      ctx.save();
      const centerX = bat.x + bat.w / 2;
      const centerY = bat.y + bat.h / 2;
      ctx.translate(centerX, centerY);
      ctx.rotate(bat.angle);

      const radiusX = bat.w / 2;
      const radiusY = bat.h / 2;

      // Handle
      const hw = 12;
      const hh = 26;
      const hx = isLeft ? -radiusX - hw : radiusX;
      const hy = -hh / 2;
      ctx.fillStyle = bat.handleColor;
      ctx.fillRect(hx, hy, hw, hh);

      // Grip Stripe
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx + 3, hy + 6);
      ctx.lineTo(hx + hw - 3, hy + 6);
      ctx.moveTo(hx + 3, hy + hh - 6);
      ctx.lineTo(hx + hw - 3, hy + hh - 6);
      ctx.stroke();

      // Wood Blade Edge
      ctx.beginPath();
      ctx.ellipse(0, 0, radiusX + 2, radiusY + 2, 0, 0, Math.PI * 2);
      ctx.fillStyle = bat.woodColor;
      ctx.fill();

      // Rubber Face
      ctx.beginPath();
      ctx.ellipse(0, 0, radiusX, radiusY, 0, 0, Math.PI * 2);
      ctx.fillStyle = bat.rubberColor;
      ctx.fill();

      // Specular highlight
      ctx.beginPath();
      ctx.ellipse(-radiusX * 0.3, -radiusY * 0.3, radiusX * 0.4, radiusY * 0.5, -Math.PI / 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.fill();

      // Active Power Glow
      if (bat === player && player.powerTimer > 0) {
        ctx.strokeStyle = '#ffb703';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, radiusX + 4, radiusY + 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function render() {
      ctx.fillStyle = '#020008';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center Divider Net
      ctx.strokeStyle = '#221133';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Top Labels
      ctx.font = "12px 'Courier New', monospace";
      ctx.fillStyle = '#ff007f';
      ctx.textAlign = 'left';
      ctx.fillText(playerName, 35, 30);

      ctx.fillStyle = '#00f2fe';
      ctx.textAlign = 'right';
      ctx.fillText(`AI [${currentDifficulty}]`, canvas.width - 35, 30);

      // Scores
      ctx.font = "bold 44px 'Courier New', monospace";
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff007f';
      ctx.fillText(player.score, canvas.width / 4, 75);
      ctx.fillStyle = '#00f2fe';
      ctx.fillText(ai.score, (canvas.width / 4) * 3, 75);

      // Power-Up Item
      if (powerUp) {
        ctx.fillStyle = powerUp.color;
        ctx.fillRect(powerUp.x, powerUp.y, powerUp.size, powerUp.size);
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(powerUp.symbol, powerUp.x + powerUp.size / 2, powerUp.y + 16);
      }

      // Ball Trail
      for (let i = 0; i < ball.trail.length; i++) {
        const pt = ball.trail[i];
        const alpha = (i + 1) / ball.trail.length * 0.3;
        ctx.fillStyle = `rgba(0, 242, 254, ${alpha})`;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, ball.r * ((i + 1) / ball.trail.length), 0, Math.PI * 2);
        ctx.fill();
      }

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Render Bats
      drawTableTennisBat(player, true);
      drawTableTennisBat(ai, false);

      // Floating "POWER UP!" Text FX
      for (let i = 0; i < floatingTexts.length; i++) {
        const ft = floatingTexts[i];
        ctx.save();
        ctx.font = "bold 18px 'Courier New', monospace";
        ctx.textAlign = 'center';
        ctx.fillStyle = ft.color;
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 15;
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // Impact Particles
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, 3, 3);
      }
      ctx.globalAlpha = 1.0;

      // Proof / Watermark at bottom right corner
      ctx.save();
      ctx.font = "10px 'Courier New', monospace";
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(0, 242, 254, 0.45)';
      ctx.fillText("DEV: ARINJAY | @itsarinjay", canvas.width - 15, canvas.height - 12);
      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
