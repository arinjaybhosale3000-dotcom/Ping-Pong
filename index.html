<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Pong Arena // Arcade Pro Edition</title>
  <style>
    :root {
      --neon-cyan: #00f2fe;
      --neon-magenta: #ff007f;
      --neon-amber: #ffb703;
      --bg-dark: #04010a;
      --panel-bg: rgba(8, 3, 18, 0.88);
      --font-stack: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: radial-gradient(circle at center, #150628 0%, #06020e 70%, var(--bg-dark) 100%);
      color: #fff;
      font-family: var(--font-stack);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }

    .wrapper {
      position: relative; box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      border-radius: 12px; overflow: hidden; border: 2px solid rgba(255, 0, 127, 0.4);
    }

    canvas { display: block; background: #020006; border-radius: 10px; }

    .scanlines {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px; pointer-events: none; z-index: 10; opacity: 0.6;
    }

    .action-bar { position: absolute; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 50; }

    .hud-btn {
      background: var(--panel-bg); border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
      padding: 8px 14px; font-family: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; cursor: pointer; border-radius: 4px;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(6px);
    }
    .hud-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

    .menu-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--panel-bg); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 30; transition: opacity 0.3s ease;
    }
    .hidden { display: none !important; opacity: 0; pointer-events: none !important; }

    h1 {
      font-size: 42px; color: var(--neon-cyan);
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.8), 0 0 35px var(--neon-cyan);
      margin-bottom: 24px; letter-spacing: 5px; text-transform: uppercase; font-weight: 900;
    }

    .form-group { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
    label { font-size: 12px; letter-spacing: 2.5px; margin-bottom: 8px; color: var(--neon-magenta); font-weight: 700; }
    input[type="text"] {
      background: rgba(17, 5, 36, 0.8); border: 2px solid var(--neon-cyan); padding: 10px 16px;
      color: #fff; font-family: inherit; font-size: 16px; border-radius: 4px; outline: none;
      text-align: center; box-shadow: 0 0 14px rgba(0, 242, 254, 0.3); width: 250px; letter-spacing: 2px;
    }

    .diff-group { display: flex; gap: 12px; margin-bottom: 28px; }
    .diff-btn {
      background: rgba(17, 5, 36, 0.6); border: 1px solid #555; color: #999;
      padding: 8px 18px; font-family: inherit; cursor: pointer; border-radius: 4px;
      font-size: 12px; letter-spacing: 1px; transition: all 0.2s;
    }
    .diff-btn.selected {
      border-color: var(--neon-magenta); color: var(--neon-magenta);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); font-weight: bold;
    }

    .primary-btn {
      background: var(--neon-magenta); border: none; color: #fff; font-family: inherit;
      font-size: 16px; font-weight: 900; padding: 14px 40px; cursor: pointer; border-radius: 4px;
      letter-spacing: 3px; box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .primary-btn:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 0, 127, 1); }

    .legend { margin-top: 20px; font-size: 11px; color: #888; letter-spacing: 1px; text-align: center; line-height: 1.6; }

    .countdown-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 1, 14, 0.55); display: flex; align-items: center; justify-content: center;
      z-index: 40; pointer-events: none;
    }
    .countdown-text {
      font-size: 80px; font-weight: 900; color: var(--neon-cyan);
      text-shadow: 0 0 30px var(--neon-cyan); letter-spacing: 6px;
      animation: popZoom 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popZoom {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      80% { transform: scale(1.0); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="scanlines"></div>

    <div class="action-bar">
      <button id="pauseBtn" class="hud-btn" type="button">PAUSE [P]</button>
      <button id="soundToggle" class="hud-btn" type="button">AUDIO: ON</button>
    </div>

    <div id="countdownScreen" class="countdown-overlay hidden">
      <div id="countdownText" class="countdown-text">READY</div>
    </div>

    <div id="startScreen" class="menu-screen">
      <h1>CYBER PONG ARENA</h1>
      <div class="form-group">
        <label for="playerName">PILOT CALLSIGN</label>
        <input type="text" id="playerName" value="COMMANDER" maxlength="12" spellcheck="false">
      </div>
      <div class="diff-group">
        <button class="diff-btn" data-diff="EASY" type="button">EASY</button>
        <button class="diff-btn selected" data-diff="MEDIUM" type="button">MEDIUM</button>
        <button class="diff-btn" data-diff="HARD" type="button">INSANE</button>
      </div>
      <button class="primary-btn" id="startBtn" type="button">ENGAGE MATCH</button>
      <div class="legend">
        Controls: [W] / [S] or [▲] / [▼] Arrows<br>
        Powerups: [⚡ OVERLOAD SPEED] &nbsp; [🛡️ SHIELD EXPANSION] &nbsp; [❄️ EMP STASIS]
      </div>
    </div>

    <div id="pauseScreen" class="menu-screen hidden">
      <h1>MATCH SUSPENDED</h1>
      <button class="primary-btn" id="resumeBtn" type="button">RESUME FLIGHT</button>
    </div>

    <div id="gameOverScreen" class="menu-screen hidden">
      <h1 id="winnerText">VICTORY</h1>
      <p id="matchStat" style="margin-bottom: 25px; color: #aaa; letter-spacing: 1.5px;"></p>
      <button class="primary-btn" id="restartBtn" type="button">RE-ENGAGE</button>
    </div>

    <canvas id="gameCanvas" width="900" height="540"></canvas>
  </div>

  <script>
    'use strict';

    // ========================================================
    // CONSTANTS & GAME TUNING
    // ========================================================
    const VIRTUAL_WIDTH = 900;
    const VIRTUAL_HEIGHT = 540;
    const WINNING_SCORE = 7;
    const FIXED_TIMESTEP = 1 / 60; 

    const CONFIG = {
      paddles: { width: 18, height: 82, playerBaseSpeed: 440, playerBoostedSpeed: 680, expandedHeight: 130, wallPadding: 32 },
      difficulty: {
        EASY:   { ballInitSpeed: 380, aiSpeed: 280, maxBallSpeed: 700, aiErrorFactor: 24 },
        MEDIUM: { ballInitSpeed: 450, aiSpeed: 390, maxBallSpeed: 880, aiErrorFactor: 12 },
        HARD:   { ballInitSpeed: 520, aiSpeed: 490, maxBallSpeed: 1080, aiErrorFactor: 0 }
      },
      powerUps: [
        { type: 'SPEED',  label: 'SPEED BOOST', color: '#ffb703', icon: '⚡', duration: 7 },
        { type: 'LENGTH', label: 'SHIELD EXPAND', color: '#06d6a0', icon: '🛡️', duration: 7 },
        { type: 'FREEZE', label: 'EMP STASIS',   color: '#00f2fe', icon: '❄️', duration: 4.5 }
      ]
    };

    // ========================================================
    // AUDIO ENGINE (Web Audio API Synthesizer & Voice TTS)
    // ========================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isMuted = false;

        // Procedural Synthesizer Settings
        this.stepIndex = 0;
        this.nextNoteTime = 0;
        this.timerID = null;
        this.tempo = 126;
        
        // 16-step bassline sequence
        this.bassNotes = [
          55.0, 55.0, 110.0, 55.0, 
          87.31, 87.31, 110.0, 87.31, 
          73.42, 73.42, 110.0, 73.42, 
          65.41, 65.41, 130.81, 65.41
        ];
        
        // Voice Synthesis Setup
        this.synth = window.speechSynthesis;
        this.voice = null;
        if (this.synth) {
          this.synth.onvoiceschanged = () => this.loadVoice();
          this.loadVoice();
        }
      }

      loadVoice() {
        if (!this.synth) return;
        const voices = this.synth.getVoices();
        const preferred = ['google uk english female', 'google us english', 'jenny natural', 'samantha', 'victoria', 'female'];
        for (const query of preferred) {
          const match = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(query));
          if (match) { this.voice = match; return; }
        }
        this.voice = voices.find(v => v.lang.startsWith('en')) || voices[0];
      }

      speak(text) {
        if (this.isMuted || !this.synth) return;
        this.synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (this.voice) utterance.voice = this.voice;
        utterance.pitch = 1.02; utterance.rate = 0.88; utterance.volume = 0.95;
        this.synth.speak(utterance);
      }

      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioClass) return;
        this.ctx = new AudioClass();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.25, this.ctx.currentTime);
        }
        if (this.isMuted && this.synth) this.synth.cancel();
        return this.isMuted;
      }

      playTone(freq, type, duration, gainVal = 0.15, pitchDrop = true) {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type; osc.frequency.setValueAtTime(freq, now);
        if (pitchDrop) osc.frequency.exponentialRampToValueAtTime(Math.max(10, freq * 0.4), now + duration);

        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + duration);
      }

      playPaddleHit(isPlayer) { this.playTone(isPlayer ? 580 : 420, 'square', 0.08, 0.18, false); }
      playWallHit() { this.playTone(280, 'sine', 0.06, 0.14, false); }
      playScore() { this.playTone(880, 'triangle', 0.25, 0.25, true); }
      
      playPowerup() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.22);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.0001, now + 0.22);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + 0.22);
      }

      // Procedural Web Audio API Background Music Sequencer
      startBGM() {
        this.init();
        this.stopBGM();
        if (!this.ctx || this.isMuted) return;
        this.nextNoteTime = this.ctx.currentTime + 0.05;
        this.stepIndex = 0;
        this.scheduler();
      }

      stopBGM() {
        if (this.timerID) {
          clearTimeout(this.timerID);
          this.timerID = null;
        }
      }

      scheduler() {
        if (!this.ctx) return;
        // Schedule audio slightly ahead of time to guarantee smooth playback
        while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
          this.schedulePattern(this.stepIndex, this.nextNoteTime);
          const secondsPerStep = (60 / this.tempo) / 4;
          this.nextNoteTime += secondsPerStep;
          this.stepIndex = (this.stepIndex + 1) % 16;
        }
        this.timerID = setTimeout(() => this.scheduler(), 35);
      }

      schedulePattern(step, time) {
        if (this.isMuted || !this.ctx) return;

        // Kick Drum (on every beat)
        if (step % 4 === 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(130, time);
          osc.frequency.exponentialRampToValueAtTime(30, time + 0.09);
          gain.gain.setValueAtTime(0.6, time);
          gain.gain.linearRampToValueAtTime(0.0001, time + 0.1);
          osc.connect(gain); gain.connect(this.masterGain);
          osc.start(time); osc.stop(time + 0.1);
        }

        // Rolling Bass Synth
        const bassFreq = this.bassNotes[step];
        const bOsc = this.ctx.createOscillator();
        const bGain = this.ctx.createGain();
        const bFilter = this.ctx.createBiquadFilter();

        bOsc.type = 'sawtooth'; bOsc.frequency.setValueAtTime(bassFreq, time);
        bFilter.type = 'lowpass'; bFilter.frequency.setValueAtTime(1200, time);
        bFilter.frequency.exponentialRampToValueAtTime(350, time + 0.12);

        bGain.gain.setValueAtTime(0.18, time); bGain.gain.linearRampToValueAtTime(0.0001, time + 0.12);

        bOsc.connect(bFilter); bFilter.connect(bGain); bGain.connect(this.masterGain);
        bOsc.start(time); bOsc.stop(time + 0.12);

        // Hi-Hat (on off-beats)
        if (step % 4 === 2) {
          const bufferSize = this.ctx.sampleRate * 0.035;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.setValueAtTime(8000, time);
          const hGain = this.ctx.createGain(); hGain.gain.setValueAtTime(0.07, time); hGain.gain.linearRampToValueAtTime(0.0001, time + 0.035);

          noise.connect(filter); filter.connect(hGain); hGain.connect(this.masterGain);
          noise.start(time); noise.stop(time + 0.035);
        }
      }
    }

    // ========================================================
    // INPUT CONTROLLER
    // ========================================================
    class InputHandler {
      constructor() {
        this.keys = new Set();
        window.addEventListener('keydown', (e) => {
          if (['ArrowUp', 'ArrowDown', ' ', 'w', 'W', 's', 'S', 'p', 'P'].includes(e.key)) e.preventDefault();
          this.keys.add(e.key.toLowerCase());
        });
        window.addEventListener('keyup', (e) => this.keys.delete(e.key.toLowerCase()));
      }
      isDown(key) { return this.keys.has(key.toLowerCase()); }
    }

    // ========================================================
    // PARTICLE & FLOATING TEXT ENGINE
    // ========================================================
    class FXEngine {
      constructor() { this.particles = []; this.floatingTexts = []; this.screenShake = 0; }
      triggerShake(amount = 8) { this.screenShake = Math.max(this.screenShake, amount); }
      
      emitParticles(x, y, color, count = 16, maxSpeed = 220) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (Math.random() * 0.7 + 0.3) * maxSpeed;
          this.particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            size: Math.random() * 3 + 2, color, life: 1.0, decay: Math.random() * 1.5 + 1.2
          });
        }
      }

      spawnFloatingText(text, x, y, color = '#00f2fe') {
        this.floatingTexts.push({ text, x, y, color, life: 1.0, vy: -80 });
      }

      update(dt) {
        if (this.screenShake > 0) this.screenShake = Math.max(0, this.screenShake - dt * 25);
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.y += ft.vy * dt; ft.life -= dt * 1.4;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
      }

      render(ctx) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (const p of this.particles) {
          ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.restore();

        for (const ft of this.floatingTexts) {
          ctx.save(); ctx.font = "bold 16px 'Courier New', monospace"; ctx.textAlign = 'center';
          ctx.fillStyle = ft.color; ctx.shadowColor = ft.color; ctx.shadowBlur = 12;
          ctx.globalAlpha = Math.max(0, ft.life); ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
        }
      }
    }

    // ========================================================
    // PADDLE & BALL ENTITIES
    // ========================================================
    class Paddle {
      constructor(x, isPlayer) {
        this.x = x; this.w = CONFIG.paddles.width; this.h = CONFIG.paddles.height;
        this.y = (VIRTUAL_HEIGHT - this.h) / 2;
        this.isPlayer = isPlayer; this.score = 0; this.angle = 0;
        this.powerTimer = 0; this.freezeTimer = 0; this.activePower = null;
      }
      reset() {
        this.h = CONFIG.paddles.height; this.y = (VIRTUAL_HEIGHT - this.h) / 2;
        this.powerTimer = 0; this.freezeTimer = 0; this.activePower = null; this.angle = 0;
      }
      applyPower(type, duration) {
        this.activePower = type; this.powerTimer = duration;
        if (type === 'LENGTH') { const prevH = this.h; this.h = CONFIG.paddles.expandedHeight; this.y -= (this.h - prevH) / 2; }
      }
      update(dt, input, ball, difficulty) {
        if (this.powerTimer > 0) {
          this.powerTimer -= dt;
          if (this.powerTimer <= 0) { this.h = CONFIG.paddles.height; this.activePower = null; }
        }
        if (this.freezeTimer > 0) this.freezeTimer -= dt;

        let targetAngle = 0;

        if (this.isPlayer) {
          let speed = this.activePower === 'SPEED' ? CONFIG.paddles.playerBoostedSpeed : CONFIG.paddles.playerBaseSpeed;
          if (this.freezeTimer > 0) speed *= 0.35;

          if (input.isDown('w') || input.isDown('arrowup')) { this.y -= speed * dt; targetAngle = -0.15; }
          if (input.isDown('s') || input.isDown('arrowdown')) { this.y += speed * dt; targetAngle = 0.15; }
        } else {
          let aiSpeed = difficulty.aiSpeed;
          if (this.freezeTimer > 0) aiSpeed *= 0.35;
          const paddleCenter = this.y + this.h / 2;
          const targetY = ball.y + (Math.sin(Date.now() * 0.003) * difficulty.aiErrorFactor);

          if (Math.abs(targetY - paddleCenter) > 12) {
            if (targetY < paddleCenter) { this.y -= aiSpeed * dt; targetAngle = -0.12; }
            else { this.y += aiSpeed * dt; targetAngle = 0.12; }
          }
        }
        this.y = Math.max(12, Math.min(VIRTUAL_HEIGHT - this.h - 12, this.y));
        this.angle += (targetAngle - this.angle) * (15 * dt);
      }
      render(ctx) {
        ctx.save();
        const cx = this.x + this.w / 2; const cy = this.y + this.h / 2;
        ctx.translate(cx, cy); ctx.rotate(this.angle);

        const rx = this.w / 2; const ry = this.h / 2;
        const hw = 12; const hh = 26;
        const hx = this.isPlayer ? -rx - hw : rx; const hy = -hh / 2;
        
        ctx.fillStyle = this.isPlayer ? '#1d3557' : '#3a0ca3'; ctx.fillRect(hx, hy, hw, hh);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(hx + 3, hy + 6); ctx.lineTo(hx + hw - 3, hy + 6);
        ctx.moveTo(hx + 3, hy + hh - 6); ctx.lineTo(hx + hw - 3, hy + hh - 6); ctx.stroke();

        ctx.beginPath(); ctx.ellipse(0, 0, rx + 2, ry + 2, 0, 0, Math.PI * 2); ctx.fillStyle = '#d4a373'; ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = this.isPlayer ? '#ff0055' : '#111422'; ctx.fill();
        ctx.beginPath(); ctx.ellipse(-rx * 0.3, -ry * 0.3, rx * 0.45, ry * 0.5, -Math.PI / 6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.16)'; ctx.fill();

        if (this.powerTimer > 0) {
          ctx.strokeStyle = '#ffb703'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.ellipse(0, 0, rx + 5, ry + 5, 0, 0, Math.PI * 2); ctx.stroke();
        }
        if (this.freezeTimer > 0) {
          ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 3; ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.ellipse(0, 0, rx + 8, ry + 8, 0, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
    }

    class Ball {
      constructor() { this.r = 7; this.trail = []; this.reset(true, CONFIG.difficulty.MEDIUM); }
      reset(serveToPlayer, difficulty) {
        this.x = VIRTUAL_WIDTH / 2; this.y = VIRTUAL_HEIGHT / 2;
        this.speed = difficulty.ballInitSpeed; this.trail = [];
        const dir = serveToPlayer ? -1 : 1;
        const angle = (Math.random() * (Math.PI / 4)) - (Math.PI / 8);
        this.vx = dir * this.speed * Math.cos(angle); this.vy = this.speed * Math.sin(angle);
      }
      update(dt) {
        this.trail.push({ x: this.x, y: this.y }); if (this.trail.length > 10) this.trail.shift();
        this.x += this.vx * dt; this.y += this.vy * dt;
      }
      render(ctx) {
        for (let i = 0; i < this.trail.length; i++) {
          const pt = this.trail[i]; const progress = (i + 1) / this.trail.length;
          ctx.fillStyle = `rgba(0, 242, 254, ${progress * 0.35})`;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, this.r * progress, 0, Math.PI * 2); ctx.fill();
        }
        ctx.save(); ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 14; ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }

    // ========================================================
    // MAIN GAME ENGINE & STATE MACHINE
    // ========================================================
    class GameEngine {
      constructor() {
        this.canvas = document.getElementById('gameCanvas'); this.ctx = this.canvas.getContext('2d');
        this.input = new InputHandler(); this.sound = new SoundEngine(); this.fx = new FXEngine();

        this.state = 'MENU'; this.playerName = 'COMMANDER';
        this.difficultyKey = 'MEDIUM'; this.difficulty = CONFIG.difficulty[this.difficultyKey];

        this.player = new Paddle(CONFIG.paddles.wallPadding, true);
        this.ai = new Paddle(VIRTUAL_WIDTH - CONFIG.paddles.wallPadding - CONFIG.paddles.width, false);
        this.ball = new Ball();
        this.powerUp = null; this.powerUpSpawnCooldown = 3.0;

        this.lastTime = performance.now(); this.accumulator = 0;
        this.initDPI(); this.bindEvents();
      }

      initDPI() {
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = VIRTUAL_WIDTH * dpr; this.canvas.height = VIRTUAL_HEIGHT * dpr;
        this.canvas.style.width = `${VIRTUAL_WIDTH}px`; this.canvas.style.height = `${VIRTUAL_HEIGHT}px`;
        this.ctx.scale(dpr, dpr);
      }

      bindEvents() {
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const soundToggle = document.getElementById('soundToggle');
        const diffBtns = document.querySelectorAll('.diff-btn');

        startBtn.addEventListener('click', () => {
          this.playerName = document.getElementById('playerName').value.trim().toUpperCase() || 'PLAYER 1';
          this.sound.init(); // Unlock AudioContext
          this.startCountdown();
        });

        restartBtn.addEventListener('click', () => {
          document.getElementById('gameOverScreen').classList.add('hidden');
          this.startCountdown();
        });

        resumeBtn.addEventListener('click', () => this.togglePause());
        pauseBtn.addEventListener('click', () => this.togglePause());

        window.addEventListener('keydown', (e) => {
          if (e.key.toLowerCase() === 'p' && (this.state === 'PLAYING' || this.state === 'PAUSED')) this.togglePause();
        });

        soundToggle.addEventListener('click', () => {
          this.sound.init();
          const muted = this.sound.toggleMute();
          soundToggle.textContent = muted ? 'AUDIO: OFF' : 'AUDIO: ON';
          soundToggle.style.color = muted ? '#777' : 'var(--neon-cyan)';
          soundToggle.style.borderColor = muted ? '#555' : 'var(--neon-cyan)';
        });

        diffBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            diffBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            this.difficultyKey = btn.dataset.diff;
            this.difficulty = CONFIG.difficulty[this.difficultyKey];
          });
        });

        window.addEventListener('resize', () => this.initDPI());
      }

      togglePause() {
        if (this.state === 'PLAYING') {
          this.state = 'PAUSED'; document.getElementById('pauseScreen').classList.remove('hidden');
          this.sound.stopBGM();
        } else if (this.state === 'PAUSED') {
          this.state = 'PLAYING'; document.getElementById('pauseScreen').classList.add('hidden');
          this.sound.startBGM();
        }
      }

      startCountdown() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('pauseScreen').classList.add('hidden');

        this.player.score = 0; this.ai.score = 0; this.player.reset(); this.ai.reset(); this.powerUp = null;

        const countdownOverlay = document.getElementById('countdownScreen');
        const countdownText = document.getElementById('countdownText');
        countdownOverlay.classList.remove('hidden');
        this.state = 'COUNTDOWN';

        const steps = [
          { text: 'THREE', color: '#00f2fe', sfx: 440 },
          { text: 'TWO',   color: '#00f2fe', sfx: 554 },
          { text: 'ONE',   color: '#ffb703', sfx: 659 },
          { text: 'GO!',   color: '#ff007f', sfx: 880 }
        ];

        let index = 0;
        const tick = () => {
          if (index >= steps.length) {
            countdownOverlay.classList.add('hidden');
            this.state = 'PLAYING';
            this.ball.reset(true, this.difficulty);
            
            // Start the Procedural Sequencer!
            this.sound.startBGM();
            return;
          }
          const s = steps[index];
          countdownText.textContent = s.text; countdownText.style.color = s.color;
          countdownText.style.textShadow = `0 0 30px ${s.color}`; countdownText.style.animation = 'none';
          void countdownText.offsetWidth; 
          countdownText.style.animation = 'popZoom 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';

          this.sound.playTone(s.sfx, 'sine', 0.12, 0.25, false);
          this.sound.speak(s.text.replace('!', ''));
          
          index++; setTimeout(tick, 900);
        };
        tick();
      }

      spawnPowerUp() {
        const item = CONFIG.powerUps[Math.floor(Math.random() * CONFIG.powerUps.length)];
        this.powerUp = {
          ...item, x: VIRTUAL_WIDTH / 3 + Math.random() * (VIRTUAL_WIDTH / 3),
          y: 60 + Math.random() * (VIRTUAL_HEIGHT - 120), size: 26, pulse: 0
        };
      }

      checkPaddleCollision(paddle, isPlayer) {
        const b = this.ball;
        const nextX = b.x + b.vx * FIXED_TIMESTEP; const nextY = b.y + b.vy * FIXED_TIMESTEP;
        const pLeft = paddle.x; const pRight = paddle.x + paddle.w;
        const pTop = paddle.y; const pBottom = paddle.y + paddle.h;

        const closestX = Math.max(pLeft, Math.min(nextX, pRight));
        const closestY = Math.max(pTop, Math.min(nextY, pBottom));
        const dx = nextX - closestX; const dy = nextY - closestY;

        if (dx * dx + dy * dy <= b.r * b.r) {
          const paddleCenter = paddle.y + paddle.h / 2;
          let offset = (b.y - paddleCenter) / (paddle.h / 2);
          offset = Math.max(-1, Math.min(1, offset));
          const bounceAngle = offset * (Math.PI / 3.4); 

          b.speed = Math.min(b.speed + 28, this.difficulty.maxBallSpeed);
          const dir = isPlayer ? 1 : -1;
          b.vx = dir * b.speed * Math.cos(bounceAngle); b.vy = b.speed * Math.sin(bounceAngle);
          b.x = isPlayer ? pRight + b.r + 1 : pLeft - b.r - 1;

          this.sound.playPaddleHit(isPlayer); this.fx.triggerShake(5);
          this.fx.emitParticles(b.x, b.y, isPlayer ? '#ff0055' : '#00f2fe', 14, 280);
        }
      }

      physicsStep(dt) {
        if (this.state !== 'PLAYING') { this.fx.update(dt); return; }

        this.player.update(dt, this.input, this.ball, this.difficulty);
        this.ai.update(dt, this.input, this.ball, this.difficulty);
        this.ball.update(dt); this.fx.update(dt);

        if (this.ball.y - this.ball.r <= 0) {
          this.ball.y = this.ball.r; this.ball.vy = -this.ball.vy;
          this.sound.playWallHit(); this.fx.emitParticles(this.ball.x, this.ball.y, '#ffffff', 8, 140);
        } else if (this.ball.y + this.ball.r >= VIRTUAL_HEIGHT) {
          this.ball.y = VIRTUAL_HEIGHT - this.ball.r; this.ball.vy = -this.ball.vy;
          this.sound.playWallHit(); this.fx.emitParticles(this.ball.x, this.ball.y, '#ffffff', 8, 140);
        }

        if (this.ball.vx < 0) this.checkPaddleCollision(this.player, true);
        if (this.ball.vx > 0) this.checkPaddleCollision(this.ai, false);

        if (!this.powerUp) {
          this.powerUpSpawnCooldown -= dt;
          if (this.powerUpSpawnCooldown <= 0) { this.spawnPowerUp(); this.powerUpSpawnCooldown = 8.0 + Math.random() * 5.0; }
        } else {
          this.powerUp.pulse += dt * 5;
          const cx = this.powerUp.x + this.powerUp.size / 2; const cy = this.powerUp.y + this.powerUp.size / 2;
          const dist = Math.hypot(this.ball.x - cx, this.ball.y - cy);

          if (dist < this.ball.r + this.powerUp.size / 2) {
            const beneficiary = this.ball.vx > 0 ? this.player : this.ai;
            const victim = this.ball.vx > 0 ? this.ai : this.player;

            if (this.powerUp.type === 'FREEZE') victim.freezeTimer = this.powerUp.duration;
            else beneficiary.applyPower(this.powerUp.type, this.powerUp.duration);

            this.sound.playPowerup(); this.sound.speak("Power up!"); this.fx.triggerShake(8);
            this.fx.emitParticles(cx, cy, this.powerUp.color, 24, 300);
            this.fx.spawnFloatingText(this.powerUp.label, cx, cy, this.powerUp.color);
            this.powerUp = null;
          }
        }

        if (this.ball.x + this.ball.r < 0) { this.ai.score++; this.handleScore(false); }
        else if (this.ball.x - this.ball.r > VIRTUAL_WIDTH) { this.player.score++; this.handleScore(true); }
      }

      handleScore(playerScored) {
        this.sound.playScore(); this.fx.triggerShake(12);
        this.fx.emitParticles(playerScored ? VIRTUAL_WIDTH : 0, this.ball.y, playerScored ? '#00f2fe' : '#ff007f', 32, 400);

        if (this.player.score >= WINNING_SCORE || this.ai.score >= WINNING_SCORE) this.triggerGameOver();
        else this.ball.reset(playerScored, this.difficulty);
      }

      triggerGameOver() {
        this.state = 'GAMEOVER'; this.sound.stopBGM();
        const screen = document.getElementById('gameOverScreen');
        const playerWon = this.player.score >= WINNING_SCORE;
        document.getElementById('winnerText').textContent = playerWon ? `${this.playerName} DOMINATES` : 'AI SUPREMACY';
        document.getElementById('winnerText').style.color = playerWon ? 'var(--neon-cyan)' : 'var(--neon-magenta)';
        document.getElementById('matchStat').textContent = `FINAL SCORE: ${this.player.score} — ${this.ai.score} | RANK: ${this.difficultyKey}`;
        screen.classList.remove('hidden');
      }

      render() {
        const ctx = this.ctx;
        ctx.save();
        if (this.fx.screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * this.fx.screenShake, (Math.random() - 0.5) * this.fx.screenShake);
        }

        ctx.fillStyle = '#020008'; ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
        ctx.strokeStyle = 'rgba(255, 0, 127, 0.25)'; ctx.lineWidth = 2; ctx.setLineDash([8, 10]);
        ctx.beginPath(); ctx.moveTo(VIRTUAL_WIDTH / 2, 0); ctx.lineTo(VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(0, 242, 254, 0.15)'; ctx.strokeRect(10, 10, VIRTUAL_WIDTH - 20, VIRTUAL_HEIGHT - 20);

        ctx.font = "bold 13px 'Courier New', monospace"; ctx.fillStyle = '#ff007f'; ctx.textAlign = 'left';
        ctx.fillText(this.playerName, 40, 36);
        ctx.fillStyle = '#00f2fe'; ctx.textAlign = 'right'; ctx.fillText(`SYSTEM AI // [${this.difficultyKey}]`, VIRTUAL_WIDTH - 40, 36);

        ctx.font = "900 52px 'Courier New', monospace"; ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255, 0, 127, 0.85)'; ctx.fillText(this.player.score, VIRTUAL_WIDTH / 4, 85);
        ctx.fillStyle = 'rgba(0, 242, 254, 0.85)'; ctx.fillText(this.ai.score, (VIRTUAL_WIDTH / 4) * 3, 85);

        if (this.powerUp) {
          ctx.save();
          const cx = this.powerUp.x + this.powerUp.size / 2; const cy = this.powerUp.y + this.powerUp.size / 2;
          const scale = 1 + Math.sin(this.powerUp.pulse) * 0.08;
          ctx.translate(cx, cy); ctx.scale(scale, scale);
          ctx.shadowColor = this.powerUp.color; ctx.shadowBlur = 15; ctx.strokeStyle = this.powerUp.color; ctx.lineWidth = 2;
          ctx.strokeRect(-this.powerUp.size / 2, -this.powerUp.size / 2, this.powerUp.size, this.powerUp.size);
          ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(-this.powerUp.size / 2, -this.powerUp.size / 2, this.powerUp.size, this.powerUp.size);
          ctx.font = "14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(this.powerUp.icon, 0, 0);
          ctx.restore();
        }

        this.player.render(ctx); this.ai.render(ctx); this.ball.render(ctx); this.fx.render(ctx);
        ctx.save(); ctx.font = "10px 'Courier New', monospace"; ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(0, 242, 254, 0.4)'; ctx.fillText("CYBER-PONG V2.4 PROTOTYPE // 60FPS DT-LOCKED", VIRTUAL_WIDTH - 20, VIRTUAL_HEIGHT - 16);
        ctx.restore(); ctx.restore();
      }

      run(time) {
        const delta = Math.min((time - this.lastTime) / 1000, 0.1);
        this.lastTime = time; this.accumulator += delta;

        while (this.accumulator >= FIXED_TIMESTEP) {
          this.physicsStep(FIXED_TIMESTEP); this.accumulator -= FIXED_TIMESTEP;
        }
        this.render(); requestAnimationFrame((t) => this.run(t));
      }
    }

    window.addEventListener('load', () => {
      const game = new GameEngine(); requestAnimationFrame((t) => game.run(t));
    });
  </script>
</body>
